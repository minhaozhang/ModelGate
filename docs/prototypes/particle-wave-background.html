<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle Wave Technology Background</title>
  <style>
    :root {
      --bg: oklch(11% 0.028 262);
      --bg2: oklch(15% 0.035 260);
      --ink: oklch(95% 0.012 250);
      --muted: oklch(72% 0.025 250);
      --cyan: oklch(78% 0.18 198);
      --pink: oklch(71% 0.26 329);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: oklch(8.5% 0.022 263);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .soft-lines,
    .vignette,
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .soft-lines { display: none; }

    .grain { display: none; }

    .vignette {
      z-index: 5;
      box-shadow: inset 0 0 5rem 2rem rgba(2, 5, 16, 0.55);
    }

    .caption {
      position: absolute;
      z-index: 6;
      right: clamp(1.4rem, 8vw, 8rem);
      bottom: clamp(2.4rem, 14vh, 7rem);
      display: grid;
      grid-template-columns: 2rem 1fr;
      column-gap: 1.35rem;
      align-items: start;
      animation: caption-in 900ms cubic-bezier(.16, 1, .3, 1) both 420ms;
    }

    .plus {
      position: relative;
      width: 2rem;
      height: 2rem;
      margin-top: 0.15rem;
    }

    .plus::before,
    .plus::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: color-mix(in oklch, var(--ink), transparent 20%);
      transform: translate(-50%, -50%);
    }

    .plus::before {
      width: 1px;
      height: 2rem;
    }

    .plus::after {
      width: 2rem;
      height: 1px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      text-shadow: 0 0 1.5rem rgba(255, 255, 255, 0.12);
    }

    .caption p {
      margin: 0.55rem 0 0;
      color: var(--muted);
      font-size: clamp(0.78rem, 1.3vw, 1rem);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .hud {
      position: absolute;
      z-index: 6;
      left: clamp(1rem, 4vw, 3rem);
      top: clamp(1rem, 4vw, 2.8rem);
      color: color-mix(in oklch, var(--muted), transparent 18%);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      animation: caption-in 900ms cubic-bezier(.16, 1, .3, 1) both 650ms;
    }

    .hud::after {
      content: "";
      display: block;
      width: 9rem;
      height: 1px;
      margin-top: 0.7rem;
      background: linear-gradient(90deg, color-mix(in oklch, var(--pink), transparent 35%), transparent);
    }

    @keyframes caption-in {
      from {
        opacity: 0;
        transform: translateY(1rem);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes drift-grain {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-0.8rem, 0.45rem); }
      100% { transform: translate(0.5rem, -0.6rem); }
    }

    @media (max-width: 720px) {
      .stage {
        min-height: 100svh;
      }

      .caption {
        left: 1.25rem;
        right: 1.25rem;
        bottom: 2.6rem;
        grid-template-columns: 1.6rem 1fr;
        column-gap: 0.9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Particle wave technology background">
    <canvas id="wave" aria-hidden="true"></canvas>
    <div class="hud">Signal mesh · live</div>
    <section class="caption" aria-label="Particle Wave">
      <div class="plus" aria-hidden="true"></div>
      <div>
        <h1>Particle Wave</h1>
        <p>Technology Background</p>
      </div>
    </section>
    <div class="soft-lines"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </main>

  <script>
    const canvas = document.getElementById("wave");
    const ctx = canvas.getContext("2d", { alpha: true });
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pointer = { x: 0.5, y: 0.5, active: false };
    let w = 0;
    let h = 0;
    let dpr = 1;
    let dots = [];
    let strands = [];
    let rafId = 0;
    let lastFrame = 0;

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function colorFor(t, alpha) {
      const stops = [
        [0.00, [235, 25, 255]],
        [0.28, [188, 55, 255]],
        [0.52, [0, 145, 255]],
        [0.78, [0, 200, 232]],
        [1.00, [66, 255, 230]],
      ];
      let left = stops[0];
      let right = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i += 1) {
        if (t >= stops[i][0] && t <= stops[i + 1][0]) {
          left = stops[i];
          right = stops[i + 1];
          break;
        }
      }
      const span = right[0] - left[0] || 1;
      const local = (t - left[0]) / span;
      const r = Math.round(lerp(left[1][0], right[1][0], local));
      const g = Math.round(lerp(left[1][1], right[1][1], local));
      const b = Math.round(lerp(left[1][2], right[1][2], local));
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildWave();
    }

    function buildWave() {
      const rows = reduced ? 12 : clamp(Math.floor(h / 40), 12, 22);
      const cols = reduced ? 72 : clamp(Math.floor(w / 20), 72, 112);
      const centerY = h * 0.43;
      const waveHeight = h * 0.2;
      strands = [];
      dots = [];

      for (let r = 0; r < rows; r += 1) {
        const rowT = rows === 1 ? 0.5 : r / (rows - 1);
        const band = (rowT - 0.5) * 2;
        const strand = [];
        for (let c = 0; c < cols; c += 1) {
          const t = cols === 1 ? 0 : c / (cols - 1);
          const x = lerp(-w * 0.08, w * 1.08, t);
          const amp =
            Math.sin(t * Math.PI * 5.2 + band * 2.5) * waveHeight * 0.34 +
            Math.sin(t * Math.PI * 12.8 + band * 1.7) * waveHeight * 0.13;
          const envelope = 0.32 + 0.72 * Math.sin(Math.PI * t);
          const y = centerY + amp * envelope + band * waveHeight * (0.15 + 0.2 * Math.sin(t * Math.PI * 6));
          const dot = {
            x,
            y,
            baseX: x,
            baseY: y,
            t,
            rowT,
            phase: Math.random() * Math.PI * 2,
            size: 1.15 + Math.random() * 1.55,
            alpha: 0.45 + Math.random() * 0.45,
          };
          strand.push(dot);
          dots.push(dot);
        }
        strands.push(strand);
      }
    }

    function drawStrands(time) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      strands.forEach((strand, index) => {
        ctx.beginPath();
        strand.forEach((dot, i) => {
          const drift = Math.sin(time * 0.00085 + dot.phase + dot.t * 9) * 9;
          const vertical = Math.cos(time * 0.0011 + dot.phase + dot.rowT * 8) * 8;
          const parallaxX = pointer.active ? (pointer.x - 0.5) * 24 * dot.t : 0;
          const parallaxY = pointer.active ? (pointer.y - 0.5) * 20 * (dot.rowT - 0.5) : 0;
          dot.x = dot.baseX + drift + parallaxX;
          dot.y = dot.baseY + vertical + parallaxY;
          if (i === 0) ctx.moveTo(dot.x, dot.y);
          else ctx.lineTo(dot.x, dot.y);
        });
        ctx.strokeStyle = colorFor(index / Math.max(strands.length - 1, 1), 0.09);
        ctx.lineWidth = 1;
        ctx.stroke();
      });
      ctx.restore();
    }

    function drawDots(time) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      dots.forEach((dot) => {
        const pulse = 0.82 + 0.18 * Math.sin(time * 0.0024 + dot.phase);
        const alpha = dot.alpha * pulse;
        ctx.beginPath();
        ctx.fillStyle = colorFor(dot.t, alpha);
        ctx.arc(dot.x, dot.y, dot.size * pulse, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawGlow(time) {
      const y = h * 0.43 + Math.sin(time * 0.0009) * h * 0.02;
      const grad = ctx.createLinearGradient(0, y, w, y);
      grad.addColorStop(0, "rgba(236, 22, 255, 0)");
      grad.addColorStop(0.2, "rgba(236, 22, 255, 0.28)");
      grad.addColorStop(0.52, "rgba(0, 150, 255, 0.18)");
      grad.addColorStop(0.82, "rgba(0, 245, 225, 0.34)");
      grad.addColorStop(1, "rgba(0, 245, 225, 0)");
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.filter = "blur(14px)";
      ctx.fillStyle = grad;
      ctx.fillRect(0, y - h * 0.08, w, h * 0.16);
      ctx.restore();
    }

    function frame(time) {
      if (time - lastFrame < 32) {
        rafId = requestAnimationFrame(frame);
        return;
      }
      lastFrame = time;
      ctx.clearRect(0, 0, w, h);
      drawStrands(time);
      drawDots(time);
      if (!reduced) rafId = requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", (event) => {
      pointer.x = event.clientX / Math.max(w, 1);
      pointer.y = event.clientY / Math.max(h, 1);
      pointer.active = true;
    }, { passive: true });
    window.addEventListener("pointerleave", () => {
      pointer.active = false;
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        cancelAnimationFrame(rafId);
      } else if (!reduced) {
        lastFrame = 0;
        rafId = requestAnimationFrame(frame);
      }
    });

    resize();
    rafId = requestAnimationFrame(frame);
  </script>
</body>
</html>

<div id="tab-opencode" class="client-pane p-6" style="display:none">
    <h2 class="text-lg font-semibold tracking-tight mb-4">{{ _('OpenCode Configuration') }}</h2>

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-5 mb-6">
        <h3 class="font-semibold tracking-tight text-gray-800 mb-3">{{ _('One-liner setup') }}</h3>
        <div class="space-y-3">
            <div>
                <div class="text-xs font-medium text-blue-700 mb-1">Windows (PowerShell)</div>
                <div class="flex items-center gap-2 rounded bg-white border border-blue-200 px-3 py-2">

                    <button type="button" onclick="copyById('ps1-cmd')" class="text-blue-500 hover:text-blue-700 text-xs px-2 py-1 rounded border border-blue-200 hover:bg-blue-50">{{ _('Copy') }}</button>
                </div>
            </div>
            <div>

                    <code id="sh-cmd" class="flex-1 text-xs text-gray-800 overflow-x-auto whitespace-nowrap"></code>
                    <button type="button" onclick="copyById('sh-cmd')" class="text-blue-500 hover:text-blue-700 text-xs px-2 py-1 rounded border border-blue-200 hover:bg-blue-50">{{ _('Copy') }}</button>
                </div>
            </div>
        </div>

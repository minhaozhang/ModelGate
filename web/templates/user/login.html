<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    {% include 'components/site_head_meta.html' %}
    <title>{{ _('API Key Login') }} - ModelGate</title>
    <link rel="icon" href="{{ app_base_path }}/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/static/css/output.css?v={{ css_version }}">
    <script src="/static/js/three.min.js"></script>
    <style>
        body { background: #050508; }
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .login-card {
            background: rgba(235, 234, 250, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(235, 234, 250, 0.08);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(235, 234, 250, 0.06);
        }
        .login-card label {
            color: rgba(237, 237, 248, 0.85);
        }
        .login-card input[type="password"] {
            background: rgba(235, 234, 250, 0.05);
            border: 1px solid rgba(235, 234, 250, 0.14);
            color: #ededf8;
        }
        .login-card input[type="password"]::placeholder {
            color: rgba(237, 237, 248, 0.4);
        }
        .login-card input[type="password"]:focus {
            border-color: rgba(129, 140, 248, 0.6);
            background: rgba(235, 234, 250, 0.08);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.18);
        }
        .login-card input[type="checkbox"] {
            accent-color: #818cf8;
        }
        #lang-select {
            background: rgba(235, 234, 250, 0.05);
            color: #ededf8a3;
            border: 1px solid rgba(235, 234, 250, 0.14);
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        #lang-select:focus { outline: none; border-color: rgba(129, 140, 248, 0.6); }
        .login-title {
            color: #ededf8;
            letter-spacing: 0.02em;
        }
        .login-subtitle { color: #ededf8a3; }
        .login-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #ededf8;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25), inset 0 1px 0 rgba(235, 234, 250, 0.18);
            transition: all 0.25s ease;
        }
        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #818cf8 0%, #a78bfa 100%);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(235, 234, 250, 0.22);
        }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden">
    <div id="particles-container"></div>

    <div class="fixed top-4 right-4 z-50">
        <select id="lang-select" onchange="switchLang(this.value)">
            <option value="en">English</option>
            <option value="zh">中文</option>
        </select>
    </div>

    <div class="login-card rounded-2xl p-8 w-full max-w-md mx-4">
        <h1 class="login-title text-2xl font-bold mb-2 text-center">ModelGate</h1>
        <p class="login-subtitle text-sm mb-6 text-center">{{ _('Empower every developer to harness the power of AI.') }}</p>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1" style="color: rgba(237,237,248,0.8)">{{ _('API Key') }}</label>
                <input type="password" id="api-key" required
                    class="w-full rounded-lg px-3 py-2 focus:outline-none"
                    placeholder="sk-...">
            </div>
            <div class="flex items-center">
                <input type="checkbox" id="remember" class="mr-2" checked>
                <label for="remember" class="text-sm" style="color: rgba(237,237,248,0.7)">{{ _('Remember API Key') }}</label>
            </div>
            <div id="error-msg" class="text-red-400 text-sm hidden"></div>
            <button type="submit" id="login-btn" class="login-btn w-full py-2.5 rounded-lg font-medium">
                {{ _('Login') }}
            </button>
        </form>

        <p class="text-sm text-center mt-4" style="color: rgba(237,237,248,0.5)">
            {{ _('Enter your API Key to view usage statistics') }}
        </p>
    </div>

    {% include 'components/lang_switch.html' %}
    <script>
        window.I18N = {
            loggingIn: {{ _('Logging in...') | tojson }},
            login: {{ _('Login') | tojson }},
            loginFailed: {{ _('Login failed') | tojson }},
            networkError: {{ _('Network error') | tojson }}
        };

        // Three.js Particle System
        let scene, camera, renderer, particles;
        let mouseX = 0, mouseY = 0;
        
        function init() {
            const container = document.getElementById('particles-container');
            
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x050508, 1);
            container.appendChild(renderer.domElement);
            
            createParticles();
            
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }
        
        function createParticles() {
            const particleCount = window.innerWidth < 768 ? 300 : 800;
            const geometry = new THREE.BufferGeometry();
            
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const rotations = new Float32Array(particleCount);
            const particleData = [];
            
            const colorPalette = [
                [0.51, 0.55, 0.97],
                [0.65, 0.55, 0.98],
                [0.39, 0.43, 0.95],
                [0.77, 0.71, 0.99],
                [0.93, 0.93, 0.97],
                [0.55, 0.36, 0.96],
            ];
            
            const rings = 10;
            const particlesPerRing = Math.floor(particleCount / rings);
            
            for (let ring = 0; ring < rings; ring++) {
                const ringRadius = 10 + ring * 10;
                const particlesInThisRing = particlesPerRing + (ring === rings - 1 ? particleCount % rings : 0);
                
                for (let i = 0; i < particlesInThisRing; i++) {
                    const idx = ring * particlesPerRing + i;
                    if (idx >= particleCount) break;
                    
                    const angle = (i / particlesInThisRing) * Math.PI * 2;
                    const x = Math.cos(angle) * ringRadius;
                    const y = Math.sin(angle) * ringRadius * 0.6;
                    const z = (Math.random() - 0.5) * 25;
                    
                    positions[idx * 3] = x;
                    positions[idx * 3 + 1] = y;
                    positions[idx * 3 + 2] = z;
                    
                    const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                    colors[idx * 3] = color[0] + (Math.random() - 0.5) * 0.1;
                    colors[idx * 3 + 1] = color[1] + (Math.random() - 0.5) * 0.1;
                    colors[idx * 3 + 2] = color[2] + (Math.random() - 0.5) * 0.1;
                    
                    const depthFactor = (z + 10) / 20;
                    sizes[idx] = (2 + Math.random() * 2.5) * (0.7 + depthFactor * 0.3);
                    
                    rotations[idx] = angle + Math.PI / 2;
                    
                    particleData.push({
                        x: x, y: y, z: z,
                        ringRadius: ringRadius,
                        baseAngle: angle,
                        angularSpeed: 0.0003 + Math.random() * 0.0005,
                        wobblePhase: Math.random() * Math.PI * 2,
                        wobbleSpeed: 0.5 + Math.random() * 1,
                        wobbleAmount: 0.3 + Math.random() * 0.5,
                        pulsePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('rotation', new THREE.BufferAttribute(rotations, 1));
            
            geometry.userData.particleData = particleData;
            
            const vertexShader = `
                attribute float size;
                attribute vec3 color;
                attribute float rotation;
                varying vec3 vColor;
                varying float vAlpha;
                varying float vRotation;
                
                void main() {
                    vColor = color;
                    vRotation = rotation;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                    vAlpha = smoothstep(-100.0, -10.0, mvPosition.z);
                }
            `;
            
            const fragmentShader = `
                varying vec3 vColor;
                varying float vAlpha;
                varying float vRotation;
                
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float c = cos(vRotation);
                    float s = sin(vRotation);
                    vec2 rotUV = vec2(uv.x * c - uv.y * s, uv.x * s + uv.y * c);
                    
                    float aspect = 3.0;
                    rotUV.y *= aspect;
                    
                    float n = 2.2;
                    float dist = pow(abs(rotUV.x)/0.35, n) + pow(abs(rotUV.y)/0.35, n);
                    float alpha = 1.0 - smoothstep(0.8, 1.2, dist);
                    
                    if (alpha < 0.01) discard;
                    
                    float shade = 1.0 - abs(rotUV.x) * 0.5 - abs(rotUV.y / aspect) * 0.2;
                    gl_FragColor = vec4(vColor * shade, alpha * vAlpha * 0.9);
                }
            `;
            
            const material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        function onMouseMove(event) {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        let time = 0;
        let centerX = 0, centerY = 0;
        
        function animate() {
            if (!REDUCE_MOTION) requestAnimationFrame(animate);
            time += 0.016;
            
            const positions = particles.geometry.attributes.position.array;
            const rotations = particles.geometry.attributes.rotation.array;
            const particleData = particles.geometry.userData.particleData;
            const particleCount = positions.length / 3;
            
            centerX += (mouseX * 55 - centerX) * 0.002;
            centerY += (mouseY * 40 - centerY) * 0.002;

            if (!REDUCE_MOTION) {
                for (let i = 0; i < particleCount; i++) {
                    const data = particleData[i];

                    const angle = data.baseAngle + time * data.angularSpeed * (1 + Math.sin(time * 0.5) * 0.3);
                    const pulse = Math.sin(time * 0.8 + data.pulsePhase) * 2;
                    const radius = data.ringRadius + pulse;

                    const x = Math.cos(angle) * radius + centerX;
                    const y = Math.sin(angle) * radius * 0.85 + centerY;

                    const wobbleX = Math.sin(time * data.wobbleSpeed + data.wobblePhase) * data.wobbleAmount;
                    const wobbleZ = Math.cos(time * data.wobbleSpeed * 0.7 + data.wobblePhase) * data.wobbleAmount * 0.5;

                    positions[i * 3] = x + wobbleX;
                    positions[i * 3 + 1] = y;
                    positions[i * 3 + 2] = data.z + wobbleZ;

                    rotations[i] = angle;
                }

                particles.geometry.attributes.position.needsUpdate = true;
                particles.geometry.attributes.rotation.needsUpdate = true;

                particles.rotation.x += (mouseY * 0.15 - particles.rotation.x) * 0.02;
                particles.rotation.y += (mouseX * 0.1 - particles.rotation.y) * 0.02;
            }

            renderer.render(scene, camera);
        }
        
        const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        init();

        // Login form handler
        const STORAGE_KEY = 'user_api_key';
        const APP_BASE_PATH = {{ app_base_path | tojson }};
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = document.getElementById('login-btn');
        
        async function tryAutoLogin(apiKey) {
            loginBtn.textContent = window.I18N.loggingIn;
            loginBtn.disabled = true;
            try {
                const resp = await fetch(`${APP_BASE_PATH}/user/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({api_key: apiKey})
                });
                if (resp.ok) {
                    window.location.href = `${APP_BASE_PATH}/user/dashboard`;
                    return true;
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            } catch (err) {
                console.error('Auto login failed:', err);
            }
            loginBtn.textContent = window.I18N.login;
            loginBtn.disabled = false;
            return false;
        }
        
        (async function() {
            const savedKey = localStorage.getItem(STORAGE_KEY);
            if (savedKey) {
                document.getElementById('api-key').value = savedKey;
                await tryAutoLogin(savedKey);
            }
        })();
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiKey = document.getElementById('api-key').value;
            const remember = document.getElementById('remember').checked;
            errorMsg.classList.add('hidden');
            
            loginBtn.textContent = window.I18N.loggingIn;
            loginBtn.disabled = true;
            
            try {
                const resp = await fetch(`${APP_BASE_PATH}/user/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({api_key: apiKey})
                });
                const data = await resp.json();
                
                if (resp.ok) {
                    if (remember) {
                        localStorage.setItem(STORAGE_KEY, apiKey);
                    } else {
                        localStorage.removeItem(STORAGE_KEY);
                    }
                    window.location.href = `${APP_BASE_PATH}/user/dashboard`;
                } else {
                    errorMsg.textContent = data.error || window.I18N.loginFailed;
                    errorMsg.classList.remove('hidden');
                    loginBtn.textContent = window.I18N.login;
                    loginBtn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = window.I18N.networkError;
                errorMsg.classList.remove('hidden');
                loginBtn.textContent = window.I18N.login;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

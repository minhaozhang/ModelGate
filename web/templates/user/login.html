<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    {% include 'components/site_head_meta.html' %}
    <title>{{ _('API Key Login') }} - ModelGate</title>
    <link rel="icon" href="{{ app_base_path }}/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/static/css/output.css?v={{ css_version }}">
    <link rel="stylesheet" href="/static/css/particle-bg.css?v={{ css_version }}">
    <script src="/static/js/particle-bg.js?v={{ css_version }}"></script>
    <style>
        body { background: #050508; color: #ededf8; }
        .login-card {
            background: rgba(235, 234, 250, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(235, 234, 250, 0.08);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(235, 234, 250, 0.06);
        }
        .login-card label {
            color: rgba(237, 237, 248, 0.85);
        }
        .login-card input[type="password"] {
            background: rgba(235, 234, 250, 0.05);
            border: 1px solid rgba(235, 234, 250, 0.14);
            color: #ededf8;
        }
        .login-card input[type="password"]::placeholder {
            color: rgba(237, 237, 248, 0.5);
        }
        .login-card input[type="password"]:focus {
            border-color: rgba(129, 140, 248, 0.6);
            background: rgba(235, 234, 250, 0.08);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.18);
        }
        .login-card input[type="checkbox"] {
            accent-color: #818cf8;
        }
        #lang-select {
            background: rgba(235, 234, 250, 0.05);
            color: #ededf8a3;
            border: 1px solid rgba(235, 234, 250, 0.14);
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        #lang-select:focus { outline: none; border-color: rgba(129, 140, 248, 0.6); }
        .login-title {
            color: #ededf8;
            letter-spacing: 0.02em;
        }
        .login-subtitle { color: #ededf8a3; }
        .login-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #6d28d9 100%);
            color: #ededf8;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25), inset 0 1px 0 rgba(235, 234, 250, 0.18);
            transition: all 0.25s ease;
        }
        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #4338ca 0%, #5b21b6 100%);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(235, 234, 250, 0.22);
        }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden">
    <div class="fixed top-4 right-4 z-50">
        <select id="lang-select" onchange="switchLang(this.value)">
            <option value="en">English</option>
            <option value="zh">中文</option>
        </select>
    </div>

    <div class="login-card rounded-2xl p-8 w-full max-w-md mx-4">
        <h1 class="login-title text-2xl font-bold mb-2 text-center">ModelGate</h1>
        <p class="login-subtitle text-sm mb-6 text-center">{{ _('Empower every developer to harness the power of AI.') }}</p>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1" style="color: rgba(237,237,248,0.8)">{{ _('API Key') }}</label>
                <input type="password" id="api-key" required
                    class="w-full rounded-lg px-3 py-2 focus:outline-none"
                    placeholder="sk-...">
            </div>
            <div class="flex items-center">
                <input type="checkbox" id="remember" class="mr-2" checked>
                <label for="remember" class="text-sm" style="color: rgba(237,237,248,0.7)">{{ _('Remember API Key') }}</label>
            </div>
            <div id="error-msg" class="text-red-400 text-sm hidden"></div>
            <button type="submit" id="login-btn" class="login-btn w-full py-2.5 rounded-lg font-medium">
                {{ _('Login') }}
            </button>
        </form>

        <p class="text-sm text-center mt-4" style="color: rgba(237,237,248,0.5)">
            {{ _('Enter your API Key to view usage statistics') }}
        </p>
    </div>

    {% include 'components/lang_switch.html' %}
    <script>
        window.I18N = {
            loggingIn: {{ _('Logging in...') | tojson }},
            login: {{ _('Login') | tojson }},
            loginFailed: {{ _('Login failed') | tojson }},
            networkError: {{ _('Network error') | tojson }}
        };

        if (window.ParticleBG) ParticleBG.setTheme('dark');

        // Login form handler
        const STORAGE_KEY = 'user_api_key';
        const APP_BASE_PATH = {{ app_base_path | tojson }};
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = document.getElementById('login-btn');
        
        async function tryAutoLogin(apiKey) {
            loginBtn.textContent = window.I18N.loggingIn;
            loginBtn.disabled = true;
            try {
                const resp = await fetch(`${APP_BASE_PATH}/user/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({api_key: apiKey})
                });
                if (resp.ok) {
                    window.location.href = `${APP_BASE_PATH}/user/dashboard`;
                    return true;
                } else {
                    localStorage.removeItem(STORAGE_KEY);
                }
            } catch (err) {
                console.error('Auto login failed:', err);
            }
            loginBtn.textContent = window.I18N.login;
            loginBtn.disabled = false;
            return false;
        }
        
        (async function() {
            const savedKey = localStorage.getItem(STORAGE_KEY);
            if (savedKey) {
                document.getElementById('api-key').value = savedKey;
                await tryAutoLogin(savedKey);
            }
        })();
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apiKey = document.getElementById('api-key').value;
            const remember = document.getElementById('remember').checked;
            errorMsg.classList.add('hidden');
            
            loginBtn.textContent = window.I18N.loggingIn;
            loginBtn.disabled = true;
            
            try {
                const resp = await fetch(`${APP_BASE_PATH}/user/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({api_key: apiKey})
                });
                const data = await resp.json();
                
                if (resp.ok) {
                    if (remember) {
                        localStorage.setItem(STORAGE_KEY, apiKey);
                    } else {
                        localStorage.removeItem(STORAGE_KEY);
                    }
                    window.location.href = `${APP_BASE_PATH}/user/dashboard`;
                } else {
                    errorMsg.textContent = data.error || window.I18N.loginFailed;
                    errorMsg.classList.remove('hidden');
                    loginBtn.textContent = window.I18N.login;
                    loginBtn.disabled = false;
                }
            } catch (err) {
                errorMsg.textContent = window.I18N.networkError;
                errorMsg.classList.remove('hidden');
                loginBtn.textContent = window.I18N.login;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

<script>
(function(){
  if (!/\/admin(\/|$)/.test(location.pathname)) return;
  try {
    var m = localStorage.getItem('admin_theme') || 'dark';
    if (m !== 'dark' && m !== 'blackgold') return;
    var cls = m === 'dark' ? 'theme-dark' : 'theme-blackgold';
    var bg = m === 'dark' ? '#020617' : '#0a0a0a';
    document.documentElement.style.background = bg;
    var apply = function(b){ if (b && !b.classList.contains(cls)) b.classList.add(cls); };
    if (document.body) { apply(document.body); return; }
    var obs = new MutationObserver(function(){
      if (document.body) { apply(document.body); obs.disconnect(); }
    });
    obs.observe(document.documentElement, { childList: true });
  } catch(e) {}
})();
</script>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    {% include 'components/site_head_meta.html' %}
    <title>{{ _('Login') }} - ModelGate</title>
    <link rel="icon" href="{{ app_base_path }}/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/static/css/output.css?v={{ css_version }}">
    <link rel="stylesheet" href="/static/css/particle-bg.css?v={{ css_version }}">
    <script src="/static/js/particle-bg.js?v={{ css_version }}"></script>
    <style>
        body { background: #050508; }
        .login-card {
            background: rgba(10, 10, 20, 0.2);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .login-card label {
            color: rgba(255, 255, 255, 0.85);
        }
        .login-card input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .login-card input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        .login-card input:focus {
            border-color: rgba(100, 150, 255, 0.6);
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden">
    <div class="fixed top-4 right-4 z-10">
        <select id="lang-select" onchange="switchLang(this.value)" class="bg-black/20 text-white/80 border border-white/20 rounded px-3 py-2 text-sm backdrop-blur-sm focus:outline-none">
            <option value="en" class="text-gray-900">English</option>
            <option value="zh" class="text-gray-900">&#20013;&#25991;</option>
        </select>
    </div>

    <div class="login-card rounded-2xl shadow-2xl p-8 w-full max-w-md mx-4">
        <h1 class="text-2xl font-bold text-white mb-2 text-center">ModelGate</h1>
        <p class="text-sm text-white/65 mb-6 text-center">{{ _('Empower every developer to harness the power of AI.') }}</p>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1" style="color: rgba(255,255,255,0.8)">{{ _('Username') }}</label>
                <input type="text" id="username" required
                    class="w-full rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="{{ _('Enter username') }}">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1" style="color: rgba(255,255,255,0.8)">{{ _('Password') }}</label>
                <input type="password" id="password" required
                    class="w-full rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    placeholder="{{ _('Enter admin password') }}">
            </div>
            <div id="error" class="text-red-400 text-sm hidden"></div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-500 text-white py-2.5 rounded-lg hover:from-blue-600 hover:to-purple-600 font-medium transition-all shadow-lg hover:shadow-xl">
                {{ _('Login') }}
            </button>
        </form>
    </div>

    {% include 'components/lang_switch.html' %}

    <script>
        if (window.ParticleBG) ParticleBG.setTheme('dark');

        const APP_BASE_PATH = {{ app_base_path | tojson }};

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            try {
                const resp = await fetch(`${APP_BASE_PATH}/admin/api/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = `${APP_BASE_PATH}/admin/home`;
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Connection error';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="utf-8">
    {% include 'components/site_head_meta.html' %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ModelGate</title>
    <link rel="icon" href="{{ app_base_path }}/favicon.ico" sizes="any">
    <link rel="stylesheet" href="{{ app_base_path }}/static/css/fonts-d.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #09090b;
            --bg-alt: #f0faf4;
            --bg-alt-text: #09090b;
            --bg-alt-muted: #3d5a4a;
            --accent: #22c55e;
            --accent-dim: #16a34a;
            --accent-bright: #4ade80;
            --accent-subtle: rgba(34, 197, 94, 0.08);
            --accent-border: rgba(34, 197, 94, 0.15);
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --text-faint: #71717a;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
            --sans: 'Instrument Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            font-size: 16px;
            line-height: 1.6;
        }

        .mono { font-family: var(--mono); }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 56px;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }

        .nav-brand span { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }

        .nav-right { display: flex; align-items: center; gap: 16px; }

        .nav-link {
            font-size: 14px;
            color: var(--text-faint);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover { color: var(--text); }

        .lang-select {
            appearance: none;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 8px;
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .lang-select:hover { border-color: var(--border-hover); }
        .lang-select option { background: #18181b; color: var(--text); }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .section-label-dot {
            width: 6px; height: 6px;
            border-radius: 1px;
            background: var(--accent);
        }

        .hero {
            padding: 160px 24px 80px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -160px;
            right: -120px;
            width: 640px;
            height: 640px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.14), transparent 65%);
            pointer-events: none;
            z-index: -1;
        }

        #hero-canvas {
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 100px;
            border: 1px solid var(--accent-border);
            background: var(--accent-subtle);
            font-family: var(--mono);
            font-size: 12px;
            color: var(--accent);
            font-weight: 500;
            letter-spacing: 0.02em;
            margin-bottom: 32px;
        }

        .hero-badge-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--accent);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hero h1 {
            font-size: clamp(44px, 7vw, 84px);
            line-height: 1.05;
            font-weight: 500;
            letter-spacing: -0.035em;
            max-width: 760px;
            color: var(--text);
        }

        .hero h1 .accent { color: var(--accent); }

        .hero-desc {
            margin-top: 24px;
            font-size: 17px;
            line-height: 1.75;
            color: var(--text-muted);
            max-width: 560px;
        }

        .hero-actions {
            margin-top: 36px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            font-family: var(--sans);
        }

        .btn-primary { background: var(--accent); color: #09090b; }
        .btn-primary:hover {
            background: var(--accent-bright);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-hover);
            color: var(--text-muted);
        }
        .btn-secondary:hover { border-color: rgba(255, 255, 255, 0.2); color: var(--text); }

        .stats-bar {
            margin-top: 64px;
            padding: 32px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stats-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            gap: 0;
        }

        .stat-item {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 8px 0;
            position: relative;
        }

        .stat-item + .stat-item { padding-left: 32px; }
        .stat-item + .stat-item::before {
            content: '';
            position: absolute;
            left: 0; top: 4px; bottom: 4px;
            width: 1px;
            background: var(--border);
        }

        .flip-container { perspective: 800px; }

        .flip-inner {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
            position: relative;
        }

        .flip-inner.flipped { transform: rotateY(180deg); }

        .flip-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }

        .flip-back {
            position: absolute;
            inset: 0;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-number {
            font-family: var(--mono);
            font-size: clamp(32px, 3.5vw, 48px);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .stat-label { font-size: 13px; color: var(--text-faint); margin-top: 4px; }

        .stat-tag {
            display: inline-block;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 6px;
        }

        .stat-tag-total {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .stat-tag-today {
            background: var(--accent-subtle);
            color: var(--accent);
            border: 1px solid var(--accent-border);
        }

        .alt-section {
            background: var(--bg-alt);
            color: var(--bg-alt-text);
            padding: 96px 24px;
        }

        .alt-section .section-label { color: var(--accent-dim); }
        .alt-section .section-label-dot { background: var(--accent-dim); }

        .section-inner { max-width: 1200px; margin: 0 auto; }

        .section-title {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1.15;
            max-width: 560px;
        }

        .section-subtitle {
            margin-top: 16px;
            font-size: 16px;
            line-height: 1.7;
            color: var(--bg-alt-muted);
            max-width: 520px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1px;
            margin-top: 48px;
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 12px;
            overflow: hidden;
        }

        .feature-card {
            background: var(--bg-alt);
            padding: 32px;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .feature-card:hover {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 0 0 1px rgba(22, 163, 74, 0.3);
        }

        .feature-icon {
            width: 40px; height: 40px;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feature-card h3 {
            margin-top: 16px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .feature-card p {
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.65;
            color: var(--bg-alt-muted);
        }

        .terminal-section { padding: 96px 24px; }

        .terminal-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }

        .terminal {
            background: #0c0c0e;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
        }

        .terminal-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); }
        .terminal-dot:first-child { background: #ef4444; }
        .terminal-dot:nth-child(2) { background: #eab308; }
        .terminal-dot:nth-child(3) { background: #22c55e; }

        .terminal-title {
            margin-left: 8px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-faint);
        }

        .terminal-body {
            padding: 20px;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.9;
            min-height: 96px;
            word-break: break-all;
        }

        .terminal-body .comment { color: #52525b; }
        .terminal-body .keyword { color: var(--accent); }
        .terminal-body .string { color: #fbbf24; }
        .terminal-body .url { color: #60a5fa; }
        .terminal-body .caret {
            display: inline-block;
            width: 8px; height: 15px;
            background: var(--accent);
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        .steps-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 32px;
        }

        .step-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-muted);
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .step-item.visible { opacity: 1; transform: translateX(0); }

        .step-num {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-subtle);
            border: 1px solid var(--accent-border);
            border-radius: 6px;
            min-width: 28px; height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cta-section {
            padding: 96px 24px 120px;
            border-top: 1px solid var(--border);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 760px;
            height: 500px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(34, 197, 94, 0.11), transparent 65%);
            pointer-events: none;
        }

        .cta-section > * { position: relative; }

        .cta-section h2 {
            font-size: clamp(36px, 5.5vw, 64px);
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .cta-section h2 .accent { color: var(--accent); }

        .cta-actions {
            margin-top: 36px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .cli-command {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 13px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
        }

        .cli-command .prefix { color: var(--accent); }

        footer {
            border-top: 1px solid var(--border);
            padding: 24px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-link {
            font-size: 13px;
            color: var(--text-faint);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-link:hover { color: var(--text-muted); }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .scroll-reveal.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .stats-inner { flex-direction: column; gap: 24px; }
            .stat-item + .stat-item { padding-left: 0; }
            .stat-item + .stat-item::before { display: none; }
            .terminal-layout { grid-template-columns: 1fr; }
            .features-grid { grid-template-columns: 1fr; }
            .hero { padding: 120px 24px 60px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .scroll-reveal { opacity: 1; transform: none; transition: none; }
            .step-item { opacity: 1; transform: none; transition: none; }
            .flip-inner { transition: none; }
            .hero-badge-dot, .terminal-body .caret { animation: none; }
        }
    </style>
</head>

            </div>
            <div class="stat-item">
                <div class="flip-container" id="flip-tokens">
                    <div class="flip-inner">
                        <div class="flip-face">
                            <div>
                                <div class="stat-number" id="stat-tokens">--</div>
                                <div class="stat-label" id="stat-tokens-label"></div>
                                <span class="stat-tag stat-tag-total" id="badge-total-tok">TOTAL</span>

                                <span class="stat-tag stat-tag-today" id="badge-today-tok">TODAY</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="terminal-section">

    <footer>

    <script>

    var SERVER_LOCALE = {{ current_locale | tojson }};
    var translations = {

            heroDesc: "ModelGate routes LLM traffic across providers with health-aware key selection, layered concurrency control, and full observability — through OpenAI- and Anthropic-compatible endpoints.",
            userLogin: "Get Started",
            docsBtn: "View Source",
            totalRequests: "Total Requests",
            totalTokens: "Tokens Consumed",
            todayRequests: "Today Requests",
            todayTokens: "Today Tokens",
            badgeTotal: "TOTAL",
            badgeToday: "TODAY",
            featuresSectionLabel: "Core Features",
            featuresTitle: "Built for production LLM traffic",
            featuresSubtitle: "Routing, resilience, and governance — everything between your clients and the upstream providers.",

        },
        zh: {

            heroDesc: "ModelGate 在多供应商之间智能调度 LLM 流量：健康度选 Key、分层并发控制、全链路可观测，同时提供 OpenAI 与 Anthropic 双协议兼容端点。",
            userLogin: "开始使用",

            featuresTitle: "为生产级 LLM 流量而生",
            featuresSubtitle: "路由、韧性、治理——客户端与上游供应商之间所需要的一切。",
            feat1Title: "多协议接入",
            feat1Desc: "OpenAI 兼容的 /v1/chat/completions、/v1/embeddings、/v1/models，以及 Anthropic /v1/messages 端点，全协议翻译。",
            feat2Title: "智能路由",
            feat2Desc: "按模型名、别名或 auto 虚拟模型寻址；上下文感知的候选池过滤，故障时自动降级到低优先级供应商。",
            feat3Title: "高可用自愈",

            quickstartSectionLabel: "快速开始",

            step1: "使用 API Key 登录用户门户",

            step3: "运行一行命令完成 OpenCode 配置",
            step4: "在仪表盘监控用量、成本与健康度",
            setupComment: "# 一行命令接入 OpenCode",
            baseUrl: "# base url",
            ctaTitle: "准备好统一管理\n你的 LLM 流量了吗？",
            ctaBtn: "立即开始"
        }
    };

    function readCookie(name) {
        var cookies = document.cookie.split(";").map(function(item) { return item.trim(); });
        var found = cookies.find(function(item) { return item.startsWith(name + "="); });
        return found ? decodeURIComponent(found.split("=")[1]) : "";
    }

    function getCurrentLang() {
        var cookieLang = readCookie("lang");
        if (cookieLang === "zh" || cookieLang === "en") return cookieLang;
        if (SERVER_LOCALE === "zh" || SERVER_LOCALE === "en") return SERVER_LOCALE;
        return navigator.language && navigator.language.toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
    }

    function springCounter(el, target) {
        if (!target && target !== 0) { el.textContent = "-"; return; }
        var stiffness = 280, damping = 50, mass = 1, precision = 0.5;
        var position = 0, velocity = 0, lastTime = null;
        function step(ts) {
            if (lastTime === null) lastTime = ts;
            var dt = Math.min((ts - lastTime) / 1000, 0.064);
            lastTime = ts;
            var springForce = -stiffness * (position - target);
            var dampingForce = -damping * velocity;
            velocity += (springForce + dampingForce) / mass * dt;
            position += velocity * dt;
            el.textContent = Math.round(position).toLocaleString();
            if (Math.abs(velocity) > precision || Math.abs(position - target) > precision) {
                requestAnimationFrame(step);
            } else {
                el.textContent = target.toLocaleString();
            }
        }
        requestAnimationFrame(step);
    }

    var currentLang = "en";

    function applyLang(lang) {
        currentLang = lang;
        var t = translations[lang] || translations.en;
        document.documentElement.lang = lang;
        document.getElementById("lang-select").value = lang;
        document.getElementById("badge-text").textContent = t.badge;
        document.getElementById("hero-title-line1").textContent = t.heroLine1;
        document.getElementById("hero-title-line2").textContent = t.heroLine2;
        document.getElementById("hero-desc").textContent = t.heroDesc;
        document.getElementById("user-login-btn").textContent = t.userLogin;
        document.getElementById("docs-btn").textContent = t.docsBtn;
        document.getElementById("stat-requests-label").textContent = t.totalRequests;
        document.getElementById("stat-tokens-label").textContent = t.totalTokens;
        document.getElementById("stat-today-requests-label").textContent = t.todayRequests;
        document.getElementById("stat-today-tokens-label").textContent = t.todayTokens;
        document.getElementById("badge-total-req").textContent = t.badgeTotal;
        document.getElementById("badge-total-tok").textContent = t.badgeTotal;
        document.getElementById("badge-today-req").textContent = t.badgeToday;
        document.getElementById("badge-today-tok").textContent = t.badgeToday;
        document.getElementById("features-section-label").textContent = t.featuresSectionLabel;
        document.getElementById("features-title").textContent = t.featuresTitle;
        document.getElementById("features-subtitle").textContent = t.featuresSubtitle;
        for (var i = 1; i <= 6; i++) {
            document.getElementById("feat-" + i + "-title").textContent = t["feat" + i + "Title"];
            document.getElementById("feat-" + i + "-desc").textContent = t["feat" + i + "Desc"];
        }
        document.getElementById("quickstart-section-label").textContent = t.quickstartSectionLabel;
        document.getElementById("quick-start-title").textContent = t.quickStart;
        var steps = [t.step1, t.step2, t.step3, t.step4];
        document.getElementById("steps-list").innerHTML = steps.map(function(s, i) {
            return '<li class="step-item" style="transition-delay:' + (i * 0.1) + 's"><span class="step-num">0' + (i + 1) + '</span><span>' + s + '</span></li>';
        }).join('');
        document.getElementById("base-url-label").textContent = t.baseUrl;
        document.getElementById("base-url-value").textContent = window.location.origin + APP_BASE_PATH + "/v1";
        document.getElementById("cta-title").innerHTML = t.ctaTitle.replace("\n", "<br>");
        document.getElementById("cta-btn").textContent = t.ctaBtn;
        document.getElementById("cta-url").textContent = window.location.origin + APP_BASE_PATH;
        restartTyping(t);
    }

    var typeTimer = null;

    function restartTyping(t) {
        if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            renderSetupLines(t, true);
            return;
        }
        renderSetupLines(t, false);
    }

    function renderSetupLines(t, instant) {
        var el = document.getElementById("setup-terminal");
        var origin = window.location.origin + APP_BASE_PATH;
        var lines = [
            { cls: "comment", text: t.setupComment },
            { cls: "plain", html: '<span class="keyword">PS&gt;</span> <span class="plain">irm </span><span class="string">\'' + origin + '/opencode/setup.ps1?key=sk-...\'</span><span class="plain"> | iex</span>' },
            { cls: "plain", html: '<span class="keyword">$</span> <span class="plain">curl -fsSL </span><span class="string">\'' + origin + '/opencode/setup.sh?key=sk-...\'</span><span class="plain"> | bash</span>' }
        ];
        if (instant) {
            el.innerHTML = lines.map(function(l) {
                return '<div>' + (l.html || '<span class="' + l.cls + '">' + l.text + '</span>') + '</div>';
            }).join('');
            return;
        }
        var li = 0, ci = 0;
        el.innerHTML = "";
        var divs = lines.map(function() {
            var d = document.createElement("div");
            el.appendChild(d);
            return d;
        });
        var caret = document.createElement("span");
        caret.className = "caret";
        function typeNext() {
            if (li >= lines.length) {
                divs[divs.length - 1].appendChild(caret);
                return;
            }
            var line = lines[li];
            if (line.html) {
                divs[li].innerHTML = line.html;
                divs[li].appendChild(caret);
                li++;
                typeTimer = setTimeout(typeNext, 260);
                return;
            }
            var text = line.text || "";
            divs[li].innerHTML = '<span class="' + line.cls + '">' + text.slice(0, ci + 1) + '</span>';
            divs[li].appendChild(caret);
            ci++;
            if (ci >= text.length) { li++; ci = 0; }
            typeTimer = setTimeout(typeNext, 28);
        }
        typeNext();
    }

    var flipInterval = null;
    var isFlipped = false;

    function startFlipCycle() {
        if (flipInterval) return;
        flipInterval = setInterval(function() {
            var cardReq = document.querySelector("#flip-requests .flip-inner");
            var cardTok = document.querySelector("#flip-tokens .flip-inner");
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardReq.classList.add("flipped");
                setTimeout(function() { cardTok.classList.add("flipped"); }, 500);
            } else {
                cardReq.classList.remove("flipped");
                setTimeout(function() { cardTok.classList.remove("flipped"); }, 500);
            }
        }, 4000);
    }

    function refreshStats() {
        fetch(APP_BASE_PATH + "/api/public/stats")
            .then(function(r) { return r.json(); })
            .then(function(data) {
                springCounter(document.getElementById("stat-requests"), data.total_requests);
                springCounter(document.getElementById("stat-tokens"), data.total_tokens);
                springCounter(document.getElementById("stat-today-requests"), data.today_requests || 0);
                springCounter(document.getElementById("stat-today-tokens"), data.today_tokens || 0);
                startFlipCycle();
            })
            .catch(function() {
                ["stat-requests", "stat-tokens", "stat-today-requests", "stat-today-tokens"].forEach(function(id) {
                    document.getElementById(id).textContent = "-";
                });
            });
    }

    function initHeroCanvas() {
        var canvas = document.getElementById("hero-canvas");
        if (!canvas) return;
        var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var ctx = canvas.getContext("2d");
        var hero = canvas.parentElement;
        var dots = [];
        var mouse = { x: -9999, y: -9999 };
        var linkDist = 130;

        function seed() {
            var count = Math.min(90, Math.floor(canvas.width * canvas.height / 16000));
            dots = [];
            for (var i = 0; i < count; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    r: 1.2 + Math.random() * 1.3
                });
            }
        }

        function resize() {
            var rect = hero.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            seed();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = 0; i < dots.length; i++) {
                var d = dots[i];
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(34, 197, 94, 0.6)";
                ctx.fill();
                for (var j = i + 1; j < dots.length; j++) {
                    var o = dots[j];
                    var dx = d.x - o.x, dy = d.y - o.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < linkDist) {
                        ctx.beginPath();
                        ctx.moveTo(d.x, d.y);
                        ctx.lineTo(o.x, o.y);
                        ctx.strokeStyle = "rgba(34, 197, 94, " + (0.22 * (1 - dist / linkDist)).toFixed(3) + ")";
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        if (reduced) {
            resize();
            draw();
            window.addEventListener("resize", function() { resize(); draw(); });
            return;
        }

        hero.addEventListener("mousemove", function(e) {
            var rect = hero.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });
        hero.addEventListener("mouseleave", function() { mouse.x = -9999; mouse.y = -9999; });
        window.addEventListener("resize", resize);
        resize();

        function frame() {
            for (var i = 0; i < dots.length; i++) {
                var d = dots[i];
                var dxm = d.x - mouse.x, dym = d.y - mouse.y;
                var distM = Math.sqrt(dxm * dxm + dym * dym);
                if (distM < 150 && distM > 0.01) {
                    d.vx += (dxm / distM) * 0.03;
                    d.vy += (dym / distM) * 0.03;
                }
                d.vx *= 0.99; d.vy *= 0.99;
                d.x += d.vx; d.y += d.vy;
                if (d.x < 0 || d.x > canvas.width) d.vx = -d.vx;
                if (d.y < 0 || d.y > canvas.height) d.vy = -d.vy;
            }
            draw();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    }

    document.getElementById("lang-select").addEventListener("change", function(event) {
        var lang = event.target.value;
        document.cookie = "lang=" + lang + ";path=/;max-age=31536000";
        applyLang(lang);
    });

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                entry.target.querySelectorAll(".step-item").forEach(function(s) { s.classList.add("visible"); });
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll(".scroll-reveal").forEach(function(el) { observer.observe(el); });

    applyLang(getCurrentLang());
    refreshStats();
    setInterval(refreshStats, 600000);
    initHeroCanvas();
    </script>

services:
  modelgate:
    image: 10.100.2.148:5002/modelgate:latest
    expose:
      - "8765"
    environment:
      - LOG_LEVEL=DEBUG
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./uploads/documents:/app/uploads/documents
      - ./backups:/app/backups
      - /:/host_root:ro
    restart: unless-stopped

  nginx:
    image: 10.100.2.148:5002/nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/static:/usr/share/nginx/html/static:ro
    depends_on:
      - modelgate
    restart: unless-stopped

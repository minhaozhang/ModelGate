    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #050508;
            --bg-card: rgba(235, 234, 250, 0.03);
            --bg-card-hover: rgba(235, 234, 250, 0.06);
            --border: rgba(235, 234, 250, 0.08);
            --border-hover: rgba(235, 234, 250, 0.18);
            --accent: #a78bfa;
            --accent-dim: #818cf8;
            --text-primary: #ededf8;
            --text-secondary: #ededf8b8;
            --text-muted: #ededf8a3;
            --text-faint: #ededf87a;
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            font-size: 16px;
            line-height: 1.6;
        }

        .mono { font-family: var(--mono); }

        /* ── Canvas particle background ── */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Scanning line ── */
        .scan-line {
            position: fixed;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(129, 140, 248, 0.15) 30%, rgba(129, 140, 248, 0.3) 50%, rgba(129, 140, 248, 0.15) 70%, transparent 100%);
            z-index: 0;
            pointer-events: none;
            animation: scanDown 8s linear infinite;
        }

        @keyframes scanDown {
            0% { top: -2px; opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* ── Floating orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
        }

        .orb-1 {
            width: 500px; height: 500px;
            top: -10%; left: 20%;
            background: rgba(109, 76, 255, 0.10);
            animation: orbFloat1 12s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px; height: 400px;
            bottom: 5%; right: 10%;
            background: rgba(56, 130, 246, 0.08);
            animation: orbFloat2 10s ease-in-out infinite;
        }

        .orb-3 {
            width: 300px; height: 300px;
            top: 50%; left: -5%;
            background: rgba(99, 102, 241, 0.07);
            animation: orbFloat3 14s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(40px, 30px) scale(1.05); }
            66% { transform: translate(-20px, -20px) scale(0.95); }
        }

        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -40px) scale(1.08); }
        }

        @keyframes orbFloat3 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(60px, -30px); }
        }

        /* ── Hero animations ── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .animate-in {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.6, 0.6, 0, 1) forwards;
        }

        .delay-1 { animation-delay: 0.15s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.45s; }
        .delay-4 { animation-delay: 0.6s; }

        .hero-title .accent-line { color: var(--accent); }

        .pulse-dot {
            width: 6px; height: 6px; border-radius: 50%; background: var(--accent-dim);
            animation: dotBlink 2s ease-in-out infinite;
        }

        /* ── Cards ── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: border-color 0.3s cubic-bezier(0.6, 0.6, 0, 1), background 0.3s cubic-bezier(0.6, 0.6, 0, 1), transform 0.3s cubic-bezier(0.6, 0.6, 0, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 50%), rgba(109, 76, 255, 0.06), transparent 40%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card h3, .card p { overflow-wrap: anywhere; }

        .dashboard-frame {
            border: 1px solid var(--border-hover);
            border-radius: 12px;
            overflow: hidden;
            background: #0a0a12;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        }

        .dashboard-chrome {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(235, 234, 250, 0.04);
        }

        .chrome-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(235, 234, 250, 0.14);
        }

        .chrome-url {
            margin-left: 10px;
            font-size: 11px;
            color: var(--text-faint);
        }

        .dashboard-img {
            display: block;
            width: 100%;
            height: auto;
        }

        .eco-chip {
            display: inline-block;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-card);
            transition: border-color 0.25s, color 0.25s;
        }

        .eco-chip:hover { border-color: var(--border-hover); color: var(--text-primary); }

        .card:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .card:hover::before { opacity: 1; }

        /* ── Nav ── */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 8, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .nav::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.2), transparent);
        }

        /* ── Buttons ── */
        .btn-primary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 24px;
            background: linear-gradient(180deg, rgba(235, 234, 250, 0.12), rgba(235, 234, 250, 0.06));
            border: 1px solid rgba(235, 234, 250, 0.14);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px; font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.6, 0.6, 0, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .btn-primary:hover::before { transform: translateX(100%); }

        .btn-primary:hover {
            border-color: rgba(129, 140, 248, 0.4);
            background: linear-gradient(180deg, rgba(235, 234, 250, 0.16), rgba(235, 234, 250, 0.09));
        }

        .btn-secondary {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 24px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 15px; font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.6, 0.6, 0, 1);
            text-decoration: none;
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .stat-number {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: 28px; font-weight: 600; letter-spacing: -0.02em;
        }

        @media (min-width: 640px) {
            .stat-number { font-size: 40px; }
        }

        .divider-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.12), transparent);
            position: relative;
            overflow: hidden;
        }

        .divider-line::after {
            content: '';
            position: absolute;
            top: 0; left: -30%;
            width: 30%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.3), transparent);
            animation: dividerSweep 4s ease-in-out infinite;
        }

        @keyframes dividerSweep {
            0% { left: -30%; }
            100% { left: 100%; }
        }

        .feature-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(109, 76, 255, 0.08);
            border: 1px solid rgba(109, 76, 255, 0.12);
            transition: background 0.3s;
        }

        .card:hover .feature-icon { background: rgba(109, 76, 255, 0.16); }

        .lang-select {
            appearance: none;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .lang-select:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .lang-select option { background: #131320; color: var(--text-primary); }

        .code-block {
            background: rgba(235, 234, 250, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.8;
            color: #a5b4fc;
            word-break: break-all;
            position: relative;
            overflow: hidden;
        }

        .code-block .comment { color: var(--text-faint); }
        .code-block .string { color: #fbbf24; }
        .code-block .prompt { color: var(--accent-dim); }

        .code-block::after {
            content: '';
            position: absolute;
            top: 0; left: -20%;
            width: 20%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(129, 140, 248, 0.04), transparent);
            animation: codeSweep 6s ease-in-out infinite;
        }

        @keyframes codeSweep {
            0% { left: -20%; }
            100% { left: 120%; }
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.6, 0.6, 0, 1), transform 0.7s cubic-bezier(0.6, 0.6, 0, 1);
        }

        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .step-item {
            opacity: 0;
            transform: translateX(-12px);
            transition: all 0.5s cubic-bezier(0.6, 0.6, 0, 1);
        }

        .step-item.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .step-num {
            font-family: var(--mono);
            font-size: 12px; font-weight: 600;
            color: var(--accent);
            background: rgba(109, 76, 255, 0.10);
            border: 1px solid rgba(109, 76, 255, 0.15);
            border-radius: 6px;
            min-width: 28px; height: 28px;
            display: inline-flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        @media (max-width: 639px) {
            .hero-title { font-size: 34px !important; line-height: 40px !important; }
            .quick-start-grid { grid-template-columns: 1fr !important; }
            .stats-section { grid-template-columns: 1fr !important; }
        }

        .flip-card {
            perspective: 800px;
            width: 100%;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.6s cubic-bezier(0.6, 0.6, 0, 1);
            transform-style: preserve-3d;
        }

        .flip-card-inner.flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flip-card-back {
            position: absolute;
            inset: 0;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
        }

        .flip-card-front {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
        }

        .stat-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
            background: rgba(109, 76, 255, 0.10);
            color: #a78bfa;
            border: 1px solid rgba(109, 76, 255, 0.15);
            margin-top: 8px;
        }

        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent-dim);
            margin-bottom: 20px;
        }

        .section-label-dot {
            width: 6px; height: 6px;
            border-radius: 1px;
            background: var(--accent-dim);
        }

        .cta-section { text-align: center; }

        .cta-section h2 .accent-line { color: var(--accent); }

        @media (prefers-reduced-motion: reduce) {
            .scan-line { display: none; }
            .orb-1, .orb-2, .orb-3 { animation: none; }
            .divider-line::after, .code-block::after { animation: none; opacity: 0; }
            .btn-primary::before { display: none; }
            .pulse-dot { animation: none; }
            .animate-in { animation: none; opacity: 1; }
            .scroll-reveal { opacity: 1; transform: none; transition: none; }
            .step-item { opacity: 1; transform: none; transition: none; }
            .flip-card-inner { transition: none; }
            .card, .btn-primary, .btn-secondary { transition: none; }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="scan-line"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <nav class="nav">
        <div style="max-width: 1140px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="/modelgate/favicon.svg" alt="ModelGate" style="width: 24px; height: 24px;">
                <span style="font-weight: 600; font-size: 15px; letter-spacing: -0.01em;">ModelGate</span>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="https://gitee.com/zmh/ModelGate" target="_blank" rel="noreferrer" style="font-size: 13px; color: var(--text-faint); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-faint)'">Gitee</a>
                <a href="https://atomgit.com/zhangminhao/ModelGate" target="_blank" rel="noreferrer" style="font-size: 13px; color: var(--text-faint); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-faint)'">AtomGit</a>
                <a id="nav-docs" href="https://gitee.com/zmh/ModelGate/blob/dev/README.md" target="_blank" rel="noreferrer" style="font-size: 13px; color: var(--text-faint); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-faint)'"></a>
                <select id="lang-select" class="lang-select">
                    <option value="en">EN</option>
                    <option value="zh" selected>中文</option>
                </select>
            </div>
        </div>
    </nav>

    <main style="position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 140px 24px 80px;">
        <section class="animate-in" style="text-align: center; max-width: 720px; margin: 0 auto;">
            <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg-card); margin-bottom: 28px; font-size: 13px; color: var(--text-muted);">
                <span class="pulse-dot"></span>
                <span id="badge-text"></span>
            </div>

            <h1 class="hero-title" style="font-size: 56px; line-height: 62px; font-weight: 500; letter-spacing: -0.03em; color: var(--text-primary);">
                <span id="hero-title-line1"></span><br>
                <span id="hero-title-line2" class="accent-line"></span>
            </h1>

            <p id="hero-desc" class="animate-in delay-1" style="margin-top: 20px; font-size: 16px; line-height: 28px; color: var(--text-muted); max-width: 560px; margin-left: auto; margin-right: auto;"></p>

            <div class="animate-in delay-2" style="margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a id="user-login-btn" href="/modelgate/user/login" class="btn-primary"></a>
                <a id="docs-btn" href="https://gitee.com/zmh/ModelGate" target="_blank" rel="noreferrer" class="btn-secondary"></a>
            </div>
        </section>

        <div class="divider-line scroll-reveal" style="margin: 64px 0;"></div>

        <section class="scroll-reveal stats-section" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; border: 1px solid var(--border);">
            <div class="card" style="border: none; border-radius: 0; text-align: center; overflow: visible;">
                <div class="flip-card" id="flip-requests">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="stat-number" id="stat-requests">--</div>
                            <div style="margin-top: 8px; font-size: 13px; color: var(--text-faint);" id="stat-requests-label"></div>
                            <span class="stat-badge" id="badge-total-req">TOTAL</span>
                        </div>
                        <div class="flip-card-back">
                            <div class="stat-number" id="stat-today-requests">--</div>
                            <div style="margin-top: 8px; font-size: 13px; color: var(--text-faint);" id="stat-today-requests-label"></div>
                            <span class="stat-badge" id="badge-today-req">TODAY</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card" style="border: none; border-radius: 0; text-align: center; overflow: visible;">
                <div class="flip-card" id="flip-tokens">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="stat-number" id="stat-tokens">--</div>
                            <div style="margin-top: 8px; font-size: 13px; color: var(--text-faint);" id="stat-tokens-label"></div>
                            <span class="stat-badge" id="badge-total-tok">TOTAL</span>
                        </div>
                        <div class="flip-card-back">
                            <div class="stat-number" id="stat-today-tokens">--</div>
                            <div style="margin-top: 8px; font-size: 13px; color: var(--text-faint);" id="stat-today-tokens-label"></div>
                            <span class="stat-badge" id="badge-today-tok">TODAY</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="scroll-reveal" style="margin-top: 72px;">
            <div class="section-label" style="justify-content: center;">
                <span class="section-label-dot"></span>
                <span id="preview-section-label"></span>
            </div>
            <h2 id="preview-title" style="text-align: center; font-size: 32px; font-weight: 500; letter-spacing: -0.02em;"></h2>
            <div class="dashboard-frame" style="margin: 36px auto 0; max-width: 960px;">
                <div class="dashboard-chrome">
                    <span class="chrome-dot"></span><span class="chrome-dot"></span><span class="chrome-dot"></span>
                    <span class="chrome-url mono">leturx.cc/modelgate/admin/home</span>
                </div>
                <img src="static/img/admin-dashboard.png" alt="ModelGate admin dashboard" class="dashboard-img" width="1920" height="937">
            </div>
            <div id="ecosystem-strip" style="margin-top: 40px; text-align: center;">
                <div id="ecosystem-label" style="font-size: 12px; color: var(--text-faint); letter-spacing: 0.04em;"></div>
                <div style="margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
                    <span class="eco-chip mono">OpenCode</span>
                    <span class="eco-chip mono">Claude Code</span>
                    <span class="eco-chip mono">Cursor</span>
                    <span class="eco-chip mono">Cherry Studio</span>
                    <span class="eco-chip mono">LobeChat</span>
                    <span class="eco-chip mono">OpenWebUI</span>
                    <span class="eco-chip mono">LangChain</span>
                </div>
            </div>
        </section>

        <section class="scroll-reveal" style="margin-top: 72px; text-align: center;">
            <div class="section-label" style="justify-content: center;">
                <span class="section-label-dot"></span>
                <span id="features-section-label"></span>
            </div>
            <h2 id="features-title" style="font-size: 32px; font-weight: 500; letter-spacing: -0.02em;"></h2>
            <p id="features-subtitle" style="margin: 16px auto 0; font-size: 15px; line-height: 26px; color: var(--text-muted); max-width: 520px;"></p>
            <div style="margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; text-align: left;">

    (function() {
        var canvas = document.getElementById('particle-canvas');
        var ctx = canvas.getContext('2d');
        var particles = [];
        var mouseX = -9999, mouseY = -9999;
        var width, height;
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function seed() {
            particles = [];
            var count = window.innerWidth < 768 ? 60 : 120;
            for (var i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.3 + 0.1
                });
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            seed();
        }

        resize();
        window.addEventListener('resize', function() { resize(); if (reduced) draw(); });
        if (!reduced) {
            document.addEventListener('mousemove', function(e) {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];

                if (!reduced) {
                    var dx = mouseX - p.x;
                    var dy = mouseY - p.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200 && dist > 0.01) {
                        var force = (200 - dist) / 200 * 0.02;
                        p.vx += dx * force * 0.01;
                        p.vy += dy * force * 0.01;
                    }

                    p.x += p.vx;
                    p.y += p.vy;

                    p.vx *= 0.99;
                    p.vy *= 0.99;

                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(129, 140, 248, ' + p.alpha + ')';
                ctx.fill();

                for (var j = i + 1; j < particles.length; j++) {
                    var p2 = particles[j];
                    var d = Math.sqrt(Math.pow(p.x - p2.x, 2) + Math.pow(p.y - p2.y, 2));
                    if (d < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = 'rgba(129, 140, 248, ' + (1 - d / 120) * 0.08 + ')';
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            if (!reduced) requestAnimationFrame(draw);
        }

        draw();
    })();

    function readCookie(name) {
        var cookies = document.cookie.split(";").map(function(item) { return item.trim(); });
        var found = cookies.find(function(item) { return item.startsWith(name + "="); });
        return found ? decodeURIComponent(found.split("=")[1]) : "";
    }

    function getCurrentLang() {
        var cookieLang = readCookie("lang");
        if (cookieLang === "zh" || cookieLang === "en") return cookieLang;
        return navigator.language && navigator.language.toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
    }

    function animateCounter(el, target) {
        if (!target && target !== 0) { el.textContent = '-'; return; }
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = target.toLocaleString(); return; }
        var start = 0;
        var duration = 2000;
        var startTime = null;
        function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min((ts - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.floor(eased * target).toLocaleString();
            if (progress < 1) requestAnimationFrame(step);
            else el.textContent = target.toLocaleString();
        }
        requestAnimationFrame(step);
    }

    var flipInterval = null;
    var isFlipped = false;

    function startFlipCycle() {
        if (flipInterval) return;
        flipInterval = setInterval(function() {
            var cardReq = document.querySelector('#flip-requests .flip-card-inner');
            var cardTok = document.querySelector('#flip-tokens .flip-card-inner');
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardReq.classList.add('flipped');
                setTimeout(function() { cardTok.classList.add('flipped'); }, 500);
            } else {
                cardReq.classList.remove('flipped');
                setTimeout(function() { cardTok.classList.remove('flipped'); }, 500);
            }
        }, 4000);
    }

    function refreshStats() {
        fetch(APP_BASE_PATH + '/api/public/stats')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                animateCounter(document.getElementById('stat-requests'), data.total_requests);
                animateCounter(document.getElementById('stat-tokens'), data.total_tokens);
                animateCounter(document.getElementById('stat-today-requests'), data.today_requests || 0);
                animateCounter(document.getElementById('stat-today-tokens'), data.today_tokens || 0);
                startFlipCycle();
            })
            .catch(function() {
                document.getElementById('stat-requests').textContent = '-';
                document.getElementById('stat-tokens').textContent = '-';
                document.getElementById('stat-today-requests').textContent = '-';
                document.getElementById('stat-today-tokens').textContent = '-';
            });
    }

    document.getElementById("lang-select").addEventListener("change", function(event) {
        var lang = event.target.value;

    document.querySelectorAll('.card').forEach(function(card) {
        card.addEventListener('mousemove', function(e) {
            var rect = card.getBoundingClientRect();
            card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
            card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
        });
    });

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                var steps = entry.target.querySelectorAll('.step-item');
                steps.forEach(function(s) { s.classList.add('visible'); });
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.scroll-reveal').forEach(function(el) {
        observer.observe(el);
    });

    applyLang(getCurrentLang());
    refreshStats();
    setInterval(refreshStats, 600000);
